<div class="card">
    <div class="card-body">
        <form #stdForm="ngForm" (ngSubmit)="onAddStudent()">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" name="fname" ngModel required #fName="ngModel">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" name="lname" ngModel required #lName="ngModel">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" name="email" ngModel required #email="ngModel">
            </div>
            <div class="form-group">
                <label>Contact</label>
                <input type="tel" class="form-control" name="contact" ngModel required #contact="ngModel">
            </div>
            @if (!isInEditMode) {
                <button mat-raised-button color="primary" type="submit" class="w-100">Add Student</button>
            }@else{
                <button mat-raised-button type="button" (click)="onUpdateStd()" class="w-100">Update Student</button>
            }
        </form> 
    </div>
</div>
